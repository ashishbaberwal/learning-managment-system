global:
  scrape_interval: 15s

scrape_configs:
  - job_name: lms-web
    metrics_path: /api/metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: lms-relay
    static_configs:
      - targets: ["host.docker.internal:9464"]

  - job_name: lms-worker
    static_configs:
      - targets: ["host.docker.internal:9465"]

  - job_name: lms-analytics-consumer
    static_configs:
      - targets: ["host.docker.internal:9466"]

  - job_name: lms-recommendations-consumer
    static_configs:
      - targets: ["host.docker.internal:9467"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq-exporter:9419"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
